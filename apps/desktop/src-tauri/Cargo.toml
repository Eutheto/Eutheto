[package]
name = "eutheto-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

# `dev.eutheto.phase01.desktop` is a non-public Phase-01 development identifier.
# It is not the gated production reverse-domain application identifier.
[package.metadata.eutheto]
development-identifier = "dev.eutheto.phase01.desktop"

[features]
bundled-ortools = ["dep:eutheto-solver-ortools"]

[lints]
workspace = true

[lib]
name = "eutheto_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
sha2 = "=0.10.9"

[dependencies]
eutheto-core = { path = "../../../crates/eutheto-core" }
eutheto-export = { path = "../../../crates/eutheto-export" }
eutheto-import = { path = "../../../crates/eutheto-import" }
eutheto-solver-ortools = { path = "../../../crates/eutheto-solver-ortools", optional = true }
eutheto-types = { path = "../../../crates/eutheto-types" }
libc = "=0.2.189"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "sync"] }

[dev-dependencies]
tempfile = "=3.27.0"
tauri = { version = "=2.11.5", features = ["test"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
