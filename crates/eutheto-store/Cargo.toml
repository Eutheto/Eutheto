[package]
name = "eutheto-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eutheto-types = { path = "../eutheto-types" }
eutheto-domain-ir = { path = "../eutheto-domain-ir" }
eutheto-import = { path = "../eutheto-import" }
eutheto-export = { path = "../eutheto-export" }
blake3 = "=1.8.7"
jiff = { version = "=0.2.35", features = ["serde"] }
rusqlite = { version = "=0.40.2", features = ["backup", "bundled", "limits"] }
serde = { version = "=1.0.229", features = ["derive"] }
same-file = "=1.0.6"
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["sync"] }
uuid = { version = "=1.26.1", features = ["serde", "v7"] }
zstd = "=0.13.3"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
rustix = { version = "=1.1.4", features = ["process"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
