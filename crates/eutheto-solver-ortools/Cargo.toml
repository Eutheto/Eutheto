[package]
name = "eutheto-solver-ortools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
eutheto-domain-ir = { path = "../eutheto-domain-ir" }
eutheto-planning-ir = { path = "../eutheto-planning-ir" }
eutheto-protocol = { path = "../eutheto-protocol" }
eutheto-solver-api = { path = "../eutheto-solver-api" }
eutheto-types = { path = "../eutheto-types" }
prost = "=0.14.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "process", "rt", "signal", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
process-wrap = { version = "=10.0.0", default-features = false, features = ["tokio1", "kill-on-drop", "process-group"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=10.0.0", default-features = false, features = ["tokio1", "kill-on-drop", "job-object", "creation-flags"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
