[package]
name = "eutheto-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
eutheto-command = { path = "../eutheto-command" }
eutheto-domain-ir = { path = "../eutheto-domain-ir" }
eutheto-export = { path = "../eutheto-export" }
eutheto-types = { path = "../eutheto-types" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tempfile = "=3.27.0"
uuid = { version = "=1.28.0", features = ["v7"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
eutheto-domain-api = { path = "../eutheto-domain-api" }
eutheto-workforce = { path = "../../domains/workforce/core" }
