[package]
name = "eutheto-import-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
eutheto-command = { path = "../../eutheto-command", version = "=0.1.0" }
eutheto-domain-api = { path = "../../eutheto-domain-api", version = "=0.1.0" }
eutheto-domain-ir = { path = "../../eutheto-domain-ir", version = "=0.1.0" }
eutheto-export = { path = "../../eutheto-export", version = "=0.1.0" }
eutheto-import = { path = "..", version = "=0.1.0" }
eutheto-planning-ir = { path = "../../eutheto-planning-ir", version = "=0.1.0" }
eutheto-protocol = { path = "../../eutheto-protocol", version = "=0.1.0" }
eutheto-types = { path = "../../eutheto-types", version = "=0.1.0" }
libfuzzer-sys = "=0.4.13"
prost = "=0.14.4"
serde_json = "=1.0.151"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[[bin]]
name = "scenario_envelope"
path = "fuzz_targets/scenario_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bundle"
path = "fuzz_targets/bundle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "migration_chain"
path = "fuzz_targets/migration_chain.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bundle_remap"
path = "fuzz_targets/bundle_remap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "planning_ir"
path = "fuzz_targets/planning_ir.rs"
test = false
doc = false
bench = false

[[bin]]
name = "integer_expression"
path = "fuzz_targets/integer_expression.rs"
test = false
doc = false
bench = false

[[bin]]
name = "projection"
path = "fuzz_targets/projection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "component_graph"
path = "fuzz_targets/component_graph.rs"
test = false
doc = false
bench = false

[[bin]]
name = "worker_frame"
path = "fuzz_targets/worker_frame.rs"
test = false
doc = false
bench = false

# Keep cargo-fuzz intentionally outside the release workspace and its gates.
[workspace]
members = ["."]
resolver = "3"
