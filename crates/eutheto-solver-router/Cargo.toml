[package]
name = "eutheto-solver-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
eutheto-planning-ir = { path = "../eutheto-planning-ir" }
eutheto-solver-api = { path = "../eutheto-solver-api" }
eutheto-types = { path = "../eutheto-types" }
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.53.2", features = ["time"] }

[dev-dependencies]
eutheto-domain-ir = { path = "../eutheto-domain-ir" }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["macros", "rt", "test-util"] }
