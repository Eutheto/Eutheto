[package]
name = "eutheto-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "=1.8.7"
eutheto-types = { path = "../eutheto-types" }
eutheto-command = { path = "../eutheto-command" }
eutheto-domain-api = { path = "../eutheto-domain-api" }
eutheto-domain-ir = { path = "../eutheto-domain-ir" }
eutheto-planning-ir = { path = "../eutheto-planning-ir" }
eutheto-explain = { path = "../eutheto-explain" }
eutheto-export = { path = "../eutheto-export" }
eutheto-import = { path = "../eutheto-import" }
eutheto-store = { path = "../eutheto-store" }
eutheto-solver-api = { path = "../eutheto-solver-api" }
eutheto-solver-router = { path = "../eutheto-solver-router" }
eutheto-verify = { path = "../eutheto-verify" }
eutheto-workforce = { path = "../../domains/workforce/core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["macros", "rt", "sync", "time", "process", "io-util", "fs"] }
uuid = "=1.28.0"

sha2 = "=0.10.9"
tempfile = "=3.27.0"

[dev-dependencies]
dirs = "=6.0.0"
eutheto-solver-ortools = { path = "../eutheto-solver-ortools" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[build-dependencies]
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
