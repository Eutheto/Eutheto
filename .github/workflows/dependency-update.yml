# SPDX-License-Identifier: Apache-2.0
name: Dependency policy

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-update-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  RUST_BACKTRACE: "0"
  RUST_TEST_THREADS: "1"
  EUTHETO_TEST_SEED: "0"

jobs:
  classify:
    name: Immutable inputs and migration isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      dependency_update: ${{ steps.policy.outputs.dependency_update }}
      worker_required: ${{ steps.policy.outputs.worker_required }}
      benchmark_required: ${{ steps.policy.outputs.benchmark_required }}
      sensitive: ${{ steps.policy.outputs.sensitive }}
      major_families: ${{ steps.policy.outputs.major_families }}
    steps:
      - name: Check out the pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce immutable actions and migration isolation
        id: policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path, PurePosixPath

          def git(*args, check=True):
              result = subprocess.run(
                  ['git', *args], text=True, stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE, check=check
              )
              return result.stdout

          head = git('rev-parse', 'HEAD').strip()
          base = os.environ.get('BASE_SHA', '').strip()
          if not base or subprocess.run(
              ['git', 'cat-file', '-e', f'{base}^{{commit}}'],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
          ).returncode != 0:
              base = git('rev-parse', 'HEAD^').strip()

          changed = sorted(filter(None, git(
              'diff', '--name-only', '--no-renames', '-z', base, head
          ).split('\0')))
          changed_set = set(changed)
          dependency_names = {
              'Cargo.toml', 'Cargo.lock', 'package.json', 'pnpm-lock.yaml',
              'pnpm-workspace.yaml', 'rust-toolchain.toml', 'flake.nix',
              'flake.lock', 'deny.toml', 'about.toml', '.github/dependabot.yml'
          }
          dependency_update = any(
              path in dependency_names
              or path.endswith('/Cargo.toml')
              or path.endswith('/package.json')
              or path.startswith('.github/workflows/')
              or path.startswith('nix/')
              or path.startswith('workers/ortools/')
              or path.startswith('protocol/')
              for path in changed
          )

          workflows = sorted([
              *Path('.github/workflows').glob('*.yml'),
              *Path('.github/workflows').glob('*.yaml'),
          ])
          for workflow in workflows:
              for number, line in enumerate(workflow.read_text().splitlines(), 1):
                  match = re.search(
                      r'^\s*(?:-\s*)?uses:\s*([^\s#]+)(?:\s+#\s*(\S+))?\s*$', line
                  )
                  if not match:
                      if re.search(r'^\s*(?:-\s*)?uses:', line):
                          raise SystemExit(f'{workflow}:{number}: malformed or dynamic action reference')
                      continue
                  reference, stable_tag = match.groups()
                  if reference.startswith('./'):
                      continue
                  if reference.startswith('docker://'):
                      if not re.fullmatch(r'docker://[^@\s]+@sha256:[0-9a-f]{64}', reference):
                          raise SystemExit(f'{workflow}:{number}: Docker action is not pinned to a sha256 digest')
                  else:
                      action = re.fullmatch(r'[^@\s]+@([0-9a-f]{40})', reference)
                      if not action:
                          raise SystemExit(f'{workflow}:{number}: external action is not pinned to a full commit SHA')
                  if not stable_tag or not re.fullmatch(r'v?\d+(?:\.\d+){0,2}', stable_tag):
                      raise SystemExit(f'{workflow}:{number}: immutable action pin lacks its verified stable tag comment')

          def old_bytes(path):
              result = subprocess.run(
                  ['git', 'show', f'{base}:{path}'], stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL
              )
              return result.stdout if result.returncode == 0 else None

          def major(value):
              if not isinstance(value, str):
                  return None
              match = re.search(r'(?<!\d)(\d+)', value)
              return int(match.group(1)) if match else None

          def json_at(path, old=False):
              try:
                  raw = old_bytes(path) if old else Path(path).read_bytes()
                  return json.loads(raw) if raw is not None else {}
              except (OSError, ValueError):
                  return {}

          def toml_at(path, old=False):
              try:
                  raw = old_bytes(path) if old else Path(path).read_bytes()
                  return tomllib.loads(raw.decode()) if raw is not None else {}
              except (OSError, ValueError, UnicodeDecodeError):
                  return {}

          def lock_bytes(path, old=False):
              raw = old_bytes(path) if old else (
                  Path(path).read_bytes() if Path(path).is_file() else None
              )
              return raw

          def cargo_lock_identities(old=False):
              data = toml_at('Cargo.lock', old)
              identities = set()
              for package in data.get('package', []):
                  if not isinstance(package, dict):
                      continue
                  name = package.get('name')
                  version_major = major(package.get('version'))
                  if isinstance(name, str) and version_major is not None:
                      identities.add((name, version_major))
              return identities

          def yaml_key(value):
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] == "'":
                  return value[1:-1].replace("''", "'")
              if len(value) >= 2 and value[0] == value[-1] == '"':
                  try:
                      return json.loads(value)
                  except ValueError:
                      return None
              return value

          def pnpm_lock_identities(old=False):
              raw = lock_bytes('pnpm-lock.yaml', old)
              if raw is None:
                  return set()
              try:
                  lines = raw.decode().splitlines()
              except UnicodeDecodeError:
                  return set()
              identities = set()
              in_packages = False
              for line in lines:
                  if line == 'packages:':
                      in_packages = True
                      continue
                  if in_packages and line and not line.startswith((' ', '\t')):
                      break
                  match = re.match(r'^  (.+):(?:\s+\{\})?\s*$', line) if in_packages else None
                  if not match:
                      continue
                  key = yaml_key(match.group(1))
                  if not key:
                      continue
                  key = key.lstrip('/')
                  if '/' in key and re.match(r'^v?\d', key.rsplit('/', 1)[1]):
                      name, version = key.rsplit('/', 1)
                  elif '@' in key:
                      name, version = key.rsplit('@', 1)
                  else:
                      continue
                  version = version.split('(', 1)[0]
                  version_match = re.match(r'^v?(\d+)(?:\.|$)', version)
                  if name and version_match:
                      identities.add((name, int(version_match.group(1))))
              return identities

          def lock_families(before, after, tauri_family, other_family):
              def majors_by_name(identities):
                  result = {}
                  for name, version_major in identities:
                      result.setdefault(name, set()).add(version_major)
                  return result

              before_by_name = majors_by_name(before)
              after_by_name = majors_by_name(after)
              detected = set()
              for name in before_by_name.keys() & after_by_name.keys():
                  # Pure pruning introduces no major version for the surviving name.
                  if after_by_name[name] - before_by_name[name]:
                      detected.add(tauri_family if 'tauri' in name.lower() else other_family)
              return detected

          if lock_families({('root', 1)}, {('root', 1), ('transitive', 1)}, 'tauri', 'other'):
              raise SystemExit('lock-family classifier mistakes transitive churn for a major update')
          if lock_families({('root', 1)}, {('root', 2)}, 'tauri', 'other') != {'other'}:
              raise SystemExit('lock-family classifier missed a major-version crossing')

          families = set()
          package_manifests = [p for p in changed if PurePosixPath(p).name == 'package.json']
          for path in package_manifests:
              before, after = json_at(path, True), json_at(path)
              for field in ('dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies'):
                  names = set(before.get(field, {})) | set(after.get(field, {}))
                  for name in names:
                      old_major = major(before.get(field, {}).get(name))
                      new_major = major(after.get(field, {}).get(name))
                      if old_major is not None and new_major is not None and old_major != new_major:
                          families.add('tauri-major' if 'tauri' in name.lower() else 'node-major')
              for field in ('packageManager',):
                  if major(before.get(field)) != major(after.get(field)):
                      families.add('node-toolchain-major')
              for engine in ('node', 'pnpm'):
                  if major(before.get('engines', {}).get(engine)) != major(after.get('engines', {}).get(engine)):
                      families.add('node-toolchain-major')

          def cargo_dependencies(value, result=None):
              result = {} if result is None else result
              if not isinstance(value, dict):
                  return result
              for key, child in value.items():
                  if key in {'dependencies', 'dev-dependencies', 'build-dependencies'} and isinstance(child, dict):
                      for name, spec in child.items():
                          result[name] = spec.get('version') if isinstance(spec, dict) else spec
                  elif isinstance(child, dict):
                      cargo_dependencies(child, result)
              return result

          for path in [p for p in changed if PurePosixPath(p).name == 'Cargo.toml']:
              before = cargo_dependencies(toml_at(path, True))
              after = cargo_dependencies(toml_at(path))
              for name in set(before) | set(after):
                  old_major, new_major = major(before.get(name)), major(after.get(name))
                  if old_major is not None and new_major is not None and old_major != new_major:
                      families.add('tauri-major' if name.startswith('tauri') else 'rust-major')

          if 'Cargo.lock' in changed_set:
              families.update(lock_families(
                  cargo_lock_identities(True), cargo_lock_identities(False),
                  'tauri-major', 'rust-major'
              ))
          if 'pnpm-lock.yaml' in changed_set:
              families.update(lock_families(
                  pnpm_lock_identities(True), pnpm_lock_identities(False),
                  'tauri-major', 'node-major'
              ))

          if 'rust-toolchain.toml' in changed_set:
              before = toml_at('rust-toolchain.toml', True).get('toolchain', {}).get('channel')
              after = toml_at('rust-toolchain.toml').get('toolchain', {}).get('channel')
              if major(before) != major(after):
                  families.add('rust-toolchain-major')
          if 'flake.lock' in changed_set:
              families.add('nix-input-migration')
          local_packaging_definitions = {
              'nix/checks.nix', 'nix/eutheto-cli.nix', 'nix/packages.nix',
              'nix/pdf-worker.nix', 'nix/source-filter.nix',
          }
          local_worker_files = {
              'workers/ortools/README.md',
              'workers/ortools/src/main.cc',
              'workers/ortools/src/sha256.cc',
              'workers/ortools/src/sha256.h',
              'workers/ortools/src/wire.cc',
              'workers/ortools/src/wire.h',
              'workers/ortools/src/worker.cc',
              'workers/ortools/src/worker.h',
              'workers/ortools/tests/callback_tests.cc',
              'workers/ortools/tests/candidate_benchmarks.cc',
              'workers/ortools/tests/native_tests.cc',
              'workers/ortools/solver-build-evidence.schema.json',
              'workers/ortools/solver-manifest.schema.json',
              'workers/ortools/solver-payload-evidence.schema.json',
          }
          # Only known project-owned files are local; new/upstream inputs fail closed.
          if any(
              path.startswith('nix/') and path not in local_packaging_definitions
              for path in changed
          ):
              families.add('nix-definition-migration')
          if any(
              path.startswith('workers/ortools/')
              and not (path.startswith('workers/ortools/proto/') and path.endswith('.proto'))
              and path not in local_worker_files
              for path in changed
          ):
              families.add('ortools-migration')
          if any(
              path.endswith('.proto')
              or path == 'protocol/version.json'
              or (
                  '/gen/schemas/' in path
                  and not path.startswith('apps/desktop/src-tauri/gen/schemas/')
              )
              for path in changed
          ):
              families.add('schema-migration')

          def collapse_supporting_nix_definitions(changed_families):
              primary = changed_families & {
                  'rust-toolchain-major',
                  'node-toolchain-major',
                  'schema-migration',
                  'ortools-migration',
              }
              if (
                  'nix-definition-migration' in changed_families
                  and len(primary) == 1
                  and changed_families <= primary | {'nix-definition-migration'}
              ):
                  return changed_families - {'nix-definition-migration'}
              return changed_families

          for primary in (
              'rust-toolchain-major',
              'schema-migration',
              'ortools-migration',
          ):
              if collapse_supporting_nix_definitions({
                  primary, 'nix-definition-migration'
              }) != {primary}:
                  raise SystemExit(
                      'migration classifier cannot pair one migration with supporting Nix definitions'
                  )
          if len(collapse_supporting_nix_definitions({
              'rust-toolchain-major',
              'node-toolchain-major',
              'nix-definition-migration',
          })) != 3:
              raise SystemExit(
                  'migration classifier collapsed unrelated toolchain majors'
              )
          if len(collapse_supporting_nix_definitions({
              'ortools-migration',
              'nix-input-migration',
          })) != 2:
              raise SystemExit(
                  'migration classifier collapsed an independently reviewed Nix input'
              )
          families = collapse_supporting_nix_definitions(families)
          bootstrap_change = old_bytes('.github/workflows/dependency-update.yml') is None
          if len(families) > 1 and not bootstrap_change:
              raise SystemExit(
                  'Dependency update combines independently reviewed major families/migrations: '
                  + ', '.join(sorted(families))
              )

          relevant_diff = git(
              'diff', '--unified=0', base, head, '--', 'Cargo.toml', 'Cargo.lock',
              'package.json', 'pnpm-lock.yaml', 'flake.nix', 'flake.lock', 'nix',
              'workers/ortools', 'protocol'
          )
          worker_relevant = any(
              path.startswith('workers/ortools/') or path.startswith('protocol/')
              for path in changed
          )
          worker_relevant = worker_relevant or bool(re.search(
              r'(?i)(ortools|or-tools|protobuf|protoc|prost(?:-build)?)', relevant_diff
          ))
          benchmark_relevant = worker_relevant or any(
              path.startswith('benchmarks/')
              or re.search(r'(solver|planning-ir|compiler)', path, re.I)
              for path in changed
          )

          def tree_has_file(revision, path):
              return subprocess.run(
                  ['git', 'cat-file', '-e', f'{revision}:{path}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
              ).returncode == 0

          def tree_has_benchmark_evidence(revision):
              files = git('ls-tree', '-r', '--name-only', revision, '--', 'benchmarks').splitlines()
              return any(
                  path.startswith(('benchmarks/corpus/', 'benchmarks/expected/'))
                  and not path.endswith('/README.md')
                  for path in files
              )

          worker_gate_exists = (
              tree_has_file(base, 'workers/ortools/source-contract.json')
              or tree_has_file(head, 'workers/ortools/source-contract.json')
          )
          benchmark_gate_exists = (
              tree_has_benchmark_evidence(base) or tree_has_benchmark_evidence(head)
          )
          worker_required = worker_relevant and worker_gate_exists
          benchmark_required = benchmark_relevant and benchmark_gate_exists
          sensitive_input_names = {
              '.github/CODEOWNERS', '.github/dependabot.yml', 'deny.toml',
              'about.toml', 'Justfile', 'flake.nix', 'flake.lock',
          }
          sensitive_manifest_names = {
              'Cargo.toml', 'Cargo.lock', 'package.json', 'package-lock.json',
              'npm-shrinkwrap.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml',
              'yarn.lock', 'rust-toolchain.toml', 'rust-toolchain',
          }
          sensitive = any(
              path in sensitive_input_names
              or PurePosixPath(path).name in sensitive_manifest_names
              or path.startswith('.github/workflows/')
              or path.startswith('nix/')
              or path.startswith('xtask/')
              or path.startswith('protocol/')
              or path.startswith('workers/ortools/')
              or '/capabilities/' in path
              or '/permissions/' in path
              for path in changed
          ) or bool(re.search(
              r'(?i)(crypto|ring|rustls|openssl|parser|serde|zip|url|reqwest|keyring|credential|updater|sign|tauri|protobuf|prost)',
              relevant_diff
          ))

          if git('status', '--porcelain', '--untracked-files=all').strip():
              raise SystemExit('classification mutated the checked-out source tree')

          outputs = {
              'dependency_update': str(dependency_update).lower(),
              'worker_required': str(worker_required).lower(),
              'benchmark_required': str(benchmark_required).lower(),
              'sensitive': str(sensitive).lower(),
              'major_families': ','.join(sorted(families)) or 'none',
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in outputs.items():
                  output.write(f'{key}={value}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Dependency update classification\n\n')
              summary.write(f'- dependency update: `{outputs["dependency_update"]}`\n')
              summary.write(f'- worker gate required: `{outputs["worker_required"]}`\n')
              summary.write(f'- benchmark gate required: `{outputs["benchmark_required"]}`\n')
              summary.write(f'- sensitive boundary changed: `{outputs["sensitive"]}`\n')
              summary.write(f'- isolated major family/migration: `{outputs["major_families"]}`\n')
          PY

