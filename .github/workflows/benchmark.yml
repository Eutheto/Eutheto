# SPDX-License-Identifier: Apache-2.0
name: Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/benchmark.yml"
      - "benchmarks/**"
      - "crates/**"
      - "domains/**"
      - "protocol/**"
      - "workers/**"
      - "xtask/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Justfile"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  SOURCE_DATE_EPOCH: "0"
  EUTHETO_TEST_SEED: "0"
  RAYON_NUM_THREADS: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  benchmark:
    name: Run approved benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the immutable source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
        with:
          github-token: ""
          diagnostic-endpoint: ""

      - name: Run the canonical benchmark command
        id: bench
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/eutheto-benchmark
          EUTHETO_BENCHMARK_ARTIFACTS: ${{ runner.temp }}/eutheto-benchmark-evidence
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          nix develop --no-update-lock-file .#full --command just bench

      - name: Retain bounded synthetic benchmark reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/eutheto-benchmark-evidence/*/phase03-primitives.json
            ${{ runner.temp }}/eutheto-benchmark-evidence/*/workforce.json
            ${{ runner.temp }}/eutheto-benchmark-evidence/*/workforce-cli.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

      - name: Record benchmark evidence status
        if: always()
        shell: bash
        env:
          BENCHMARK_OUTCOME: ${{ steps.bench.outcome }}
        run: |
          set -euo pipefail
          {
            echo '## Benchmark evidence'
            echo
            printf 'Canonical command outcome: %s\n' "$BENCHMARK_OUTCOME"
            echo
            echo 'Phase03 is raw backend evidence. Workforce acceptance requires original-domain verification and final admission; packaged CLI checks exercise the same corpus and worker digest.'
            echo 'Missing stage metrics remain explicitly unavailable. Unexpected semantic outcomes fail the command; resource refusal passes only its named pressure expectation.'
            echo 'These synthetic observations have unmanaged OS caches and no provider enrichment. No Phase12 performance threshold or release baseline is claimed.'
          } >> "$GITHUB_STEP_SUMMARY"
