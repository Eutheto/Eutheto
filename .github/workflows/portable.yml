name: Portable

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "13 04 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  CI: "true"
  TZ: UTC
  LANG: C
  LC_ALL: C
  RUST_TEST_THREADS: "1"
  CARGO_TERM_COLOR: never

jobs:
  select-targets:
    name: Select portable target matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
      run_matrix: ${{ steps.policy.outputs.run_matrix }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select path-relevant targets
        id: policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          event_name = os.environ["EVENT_NAME"]
          changed = []
          if event_name == "pull_request":
              base_sha = os.environ["BASE_SHA"]
              changed = subprocess.run(
                  ["git", "diff", "--name-only", f"{base_sha}...HEAD"],
                  check=True,
                  stdout=subprocess.PIPE,
                  text=True,
              ).stdout.splitlines()

          portable_prefixes = (
              ".cargo/",
              "apps/desktop/",
              "crates/",
              "nix/",
              "xtask/",
          )
          portable_exact = {
              ".envrc",
              ".github/workflows/portable.yml",
              "Cargo.lock",
              "Cargo.toml",
              "Justfile",
              "flake.lock",
              "flake.nix",
              "package.json",
              "pnpm-lock.yaml",
              "pnpm-workspace.yaml",
              "rust-toolchain.toml",
          }
          intel_prefixes = (
              ".cargo/",
              "apps/desktop/src-tauri/",
              "nix/",
              "workers/ortools/",
              "xtask/",
          )
          intel_exact = {
              ".envrc",
              ".github/workflows/ortools-worker.yml",
              ".github/workflows/portable.yml",
              "Cargo.lock",
              "Cargo.toml",
              "Justfile",
              "flake.lock",
              "flake.nix",
              "rust-toolchain.toml",
          }

          def matches(path, prefixes, exact):
              return (
                  path in exact
                  or path.endswith("/Cargo.toml")
                  or path.startswith(prefixes)
              )

          run_matrix = event_name != "pull_request" or any(
              matches(path, portable_prefixes, portable_exact) for path in changed
          )
          include_intel = event_name != "pull_request" or any(
              matches(path, intel_prefixes, intel_exact) for path in changed
          )
          run_matrix = run_matrix or include_intel
          targets = [
              {
                  "name": "Ubuntu x86_64",
                  "os": "ubuntu-24.04",
                  "nix-native": True,
                  "nix-system": "x86_64-linux",
                  "native-arch": "x86_64",
                  "phase-check": "full",
                  "nix-installer-tag": "v3.22.2",
              },
              {
                  "name": "Ubuntu arm64",
                  "os": "ubuntu-24.04-arm",
                  "nix-native": True,
                  "nix-system": "aarch64-linux",
                  "native-arch": "aarch64",
                  "phase-check": "full",
                  "nix-installer-tag": "v3.22.2",
              },
              {
                  "name": "macOS arm64",
                  "os": "macos-15",
                  "nix-native": True,
                  "nix-system": "aarch64-darwin",
                  "native-arch": "arm64",
                  "phase-check": "narrow",
                  "nix-installer-tag": "v3.22.2",
              },
              {
                  "name": "Windows x86_64",
                  "os": "windows-2025",
                  "nix-native": False,
                  "nix-system": "",
                  "native-arch": "",
                  "phase-check": "windows",
              },
              {
                  "name": "Windows arm64",
                  "os": "windows-11-arm",
                  "nix-native": False,
                  "nix-system": "",
                  "native-arch": "",
                  "phase-check": "windows",
              },
          ]
          if include_intel:
              targets.insert(
                  2,
                  {
                      "name": "macOS x86_64",
                      "os": "macos-15-intel",
                      "nix-native": True,
                      "nix-system": "x86_64-darwin",
                      "native-arch": "x86_64",
                      "phase-check": "narrow",
                      "nix-installer-tag": "v3.12.2",
                  },
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"run_matrix={str(run_matrix).lower()}\n")
              output.write(f"matrix={json.dumps({'include': targets}, separators=(',', ':'))}\n")
          PY

  native-build-test:
    name: ${{ matrix.name }} / native source build and test
    needs: select-targets
    if: needs.select-targets.outputs.run_matrix == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Nix
        if: matrix.nix-native
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          diagnostic-endpoint: ""
          github-token: ""
          source-tag: ${{ matrix.nix-installer-tag }}

      - name: Verify the native Nix system
        if: matrix.nix-native
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.native-arch }}"
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "${{ matrix.nix-system }}"

      - name: Evaluate the locked flake natively
        if: matrix.nix-native
        run: nix flake check --no-update-lock-file

      - name: Verify exact default-shell tool pins
        if: matrix.nix-native
        shell: bash
        run: |
          set -o pipefail
          test "$(nix develop --no-update-lock-file --command rustc --version | tail -n 1 | cut -d ' ' -f 2)" = "1.97.1"
          test "$(nix develop --no-update-lock-file --command node --version | tail -n 1)" = "v24.20.0"
          test "$(nix develop --no-update-lock-file --command pnpm --version | tail -n 1)" = "11.24.0"

      - name: Install locked dependencies in the default Nix shell
        if: matrix.nix-native
        run: nix develop --no-update-lock-file --command just install

      - name: Run the complete Phase-01 check in the default Nix shell
        if: matrix.nix-native && matrix.phase-check == 'full'
        run: nix develop --no-update-lock-file --command just check

      - name: Run the narrow native contract check in the default Nix shell
        if: matrix.nix-native && matrix.phase-check == 'narrow'
        run: nix develop --no-update-lock-file --command just generate-check

      - name: Select exact native Windows Node.js
        if: runner.os == 'Windows'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          check-latest: false

      - name: Activate native Windows toolchain pins
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustup show active-toolchain
          test "$(rustc --version | cut -d ' ' -f 2)" = "1.97.1"
          corepack enable
          corepack install
          test "$(node --version)" = "v24.20.0"
          test "$(pnpm --version)" = "11.24.0"

      - name: Install locked native Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo fetch --locked
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Test the real core and CLI in the default Nix shell
        if: matrix.nix-native
        run: |
          nix develop --no-update-lock-file --command cargo test --locked --all-targets --package eutheto-core --package eutheto-cli
          nix develop --no-update-lock-file --command cargo run --locked --package eutheto-cli -- status

      - name: Test core CLI export and native desktop on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --locked --all-targets --package eutheto-core --package eutheto-cli --package eutheto-export --package eutheto-desktop
          cargo run --locked --package eutheto-cli -- status

      - name: Test and build the desktop shell in the default Nix shell
        if: matrix.nix-native
        run: |
          nix develop --no-update-lock-file --command pnpm --filter @eutheto/desktop run test
          nix develop --no-update-lock-file --command pnpm --filter @eutheto/desktop run tauri build --no-bundle

      - name: Test and build the desktop shell on native Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pnpm --filter @eutheto/desktop run test
          pnpm --filter @eutheto/desktop run tauri build --no-bundle

      - name: Test desktop persistence through WebKit WebDriver
        if: runner.os == 'Linux'
        env:
          NO_AT_BRIDGE: "1"
          EUTHETO_E2E_PRIVILEGED_NETNS: "1"
        run: nix develop --no-update-lock-file --command just e2e

      - name: Launch the shell under a Linux virtual display
        if: runner.os == 'Linux'
        env:
          NO_AT_BRIDGE: "1"
        run: |
          set +e
          nix develop --no-update-lock-file --command \
            timeout --signal=TERM 10s xvfb-run -a \
              --server-args="-screen 0 1280x720x24" \
              eutheto-desktop-runtime .cache/cargo-target/release/eutheto-desktop \
              > "$RUNNER_TEMP/eutheto-desktop.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat "$RUNNER_TEMP/eutheto-desktop.log"
            echo "The desktop shell exited before the launch-smoke interval (status $status)." >&2
            exit 1
          fi

      - name: Launch the shell on macOS
        if: runner.os == 'macOS'
        run: |
          nix develop --no-update-lock-file --command \
            .cache/cargo-target/release/eutheto-desktop \
              > "$RUNNER_TEMP/eutheto-desktop.log" 2>&1 &
          desktop_pid=$!
          sleep 10
          if ! kill -0 "$desktop_pid" 2>/dev/null; then
            wait "$desktop_pid" || status=$?
            cat "$RUNNER_TEMP/eutheto-desktop.log"
            echo "The desktop shell exited before the launch-smoke interval (status ${status:-0})." >&2
            exit 1
          fi
          kill "$desktop_pid"
          wait "$desktop_pid" || true

      - name: Launch the shell on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "eutheto-desktop.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "eutheto-desktop.stderr.log"
          $binary = Resolve-Path "target/release/eutheto-desktop.exe"
          $process = Start-Process -FilePath $binary -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) {
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            throw "The desktop shell exited before the launch-smoke interval with status $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()

      - name: Record the evidence boundary
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo
            if [ "${{ matrix.nix-native }}" = "true" ]; then
              echo "This completed job proves native ${{ matrix.nix-system }} locked-flake evaluation, default-shell realization, exact Rust/Node/pnpm pins, the ${{ matrix.phase-check }} Phase-00 check lane, native source build/test evidence, and an actual unbundled shell launch."
            else
              echo "This completed job proves a locked native Windows source build, the Phase-00 core, CLI, UI, and desktop-shell checks, and an actual unbundled shell launch."
            fi
            echo "It does not prove installer or packaged-product behavior, WebView2 deployment/support, signing, notarization, or production identifiers."
            if [ "${{ runner.os }}" = "Windows" ]; then
              echo "Windows execution here does not prove WebView2 or installer deployment."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  portable-gate:
    name: Portable integration gate
    if: always()
    needs:
      - select-targets
      - native-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected native target
        env:
          MATRIX_RESULT: ${{ needs.native-build-test.result }}
          PLAN_RESULT: ${{ needs.select-targets.result }}
          RUN_MATRIX: ${{ needs.select-targets.outputs.run_matrix }}
        run: |
          test "$PLAN_RESULT" = "success"
          if [ "$RUN_MATRIX" = "true" ]; then
            test "$MATRIX_RESULT" = "success"
          else
            test "$MATRIX_RESULT" = "skipped"
          fi


  ortools-candidate-source-build-probe:
    name: ${{ matrix.name }} / OR-Tools candidate source build
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64 (static)
            os: ubuntu-24.04
            target: linux-x86_64
            generator: Unix Makefiles
            generator-platform: ""
            linkage: static
          - name: Windows x86_64 (static)
            os: windows-2025
            target: windows-x86_64
            generator: Ninja
            generator-platform: ""
            linkage: static
          - name: macOS arm64 (static)
            os: macos-15
            target: macos-arm64
            generator: Unix Makefiles
            generator-platform: ""
            linkage: static
          - name: macOS x86_64 (static)
            os: macos-15-intel
            target: macos-x86_64
            generator: Unix Makefiles
            generator-platform: ""
            linkage: static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable the MSVC command-line environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Build and test non-distributable candidate
        if: runner.os != 'Windows'
        run: >-
          cmake
          "-DREPOSITORY_ROOT=${{ github.workspace }}"
          "-DPROBE_ROOT=${{ runner.temp }}/eutheto-ortools-candidate"
          "-DPROBE_TARGET=${{ matrix.target }}"
          "-DPROBE_RUNNER_OS=${{ runner.os }}"
          "-DPROBE_RUNNER_ARCH=${{ runner.arch }}"
          "-DPROBE_GENERATOR=${{ matrix.generator }}"
          "-DPROBE_GENERATOR_PLATFORM=${{ matrix.generator-platform }}"
          "-DPROBE_LINKAGE=${{ matrix.linkage }}"
          -P "${{ github.workspace }}/workers/ortools/cmake/candidate_probe.cmake"

      - name: Build and test non-distributable candidate
        if: runner.os == 'Windows'
        run: >-
          cmake
          "-DREPOSITORY_ROOT=${{ github.workspace }}"
          "-DPROBE_ROOT=${{ runner.temp }}/eutheto-ortools-candidate"
          "-DPROBE_TARGET=${{ matrix.target }}"
          "-DPROBE_RUNNER_OS=${{ runner.os }}"
          "-DPROBE_RUNNER_ARCH=${{ runner.arch }}"
          "-DPROBE_GENERATOR=${{ matrix.generator }}"
          "-DPROBE_GENERATOR_PLATFORM=${{ matrix.generator-platform }}"
          "-DPROBE_LINKAGE=${{ matrix.linkage }}"
          -P "${{ github.workspace }}/workers/ortools/cmake/candidate_probe.cmake"

      - name: Upload candidate non-distributable text evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-non-distributable-evidence-${{ matrix.target }}-${{ matrix.linkage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eutheto-ortools-candidate/evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
