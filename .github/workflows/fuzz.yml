# SPDX-License-Identifier: Apache-2.0
name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 3"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fuzz.yml"
      - "crates/eutheto-import/fuzz/**"
      - "crates/**"
      - "domains/**"
      - "protocol/**"
      - "workers/**"
      - "xtask/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Justfile"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  SOURCE_DATE_EPOCH: "0"
  EUTHETO_TEST_SEED: "0"
  RAYON_NUM_THREADS: "1"
  CARGO_INCREMENTAL: "0"
  # cargo-fuzz/libFuzzer requires nightly language features. This dated manifest
  # is retained until a reviewed fuzz-target change deliberately advances it.
  FUZZ_TOOLCHAIN: nightly-2026-08-28

jobs:
  fuzz:
    name: Discover and run approved fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the immutable source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove the required fuzz-target gate rejects incomplete harnesses
        shell: bash
        run: |
          set -euo pipefail
          python3 crates/eutheto-import/fuzz/ci/test_verify_targets.py

      - name: Verify the exact required fuzz targets and seed corpora
        id: discover
        shell: bash
        env:
          FUZZ_DIR: crates/eutheto-import/fuzz
        run: |
          set -euo pipefail
          python3 "$FUZZ_DIR/ci/verify_targets.py" \
            "$FUZZ_DIR" \
            --github-output "$GITHUB_OUTPUT"

      - name: Install locked Nix
        uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3
        with:
          github-token: ""
          diagnostic-endpoint: ""

      - name: Check the nested fuzz harness with stable Rust
        shell: bash
        run: nix develop --no-update-lock-file .#full --command just fuzz-harness-check

      - name: Install the dated fuzz-only Rust nightly
        shell: bash
        run: |
          set -euo pipefail
          rustup set auto-self-update disable
          rustup toolchain install "$FUZZ_TOOLCHAIN" \
            --profile minimal \
            --component llvm-tools-preview \
            --no-self-update

          fuzz_cargo=$(rustup which --toolchain "$FUZZ_TOOLCHAIN" cargo)
          fuzz_rustc=$(rustup which --toolchain "$FUZZ_TOOLCHAIN" rustc)
          fuzz_rustdoc=$(rustup which --toolchain "$FUZZ_TOOLCHAIN" rustdoc)
          commit_date=$($fuzz_rustc --version --verbose | sed -n 's/^commit-date: //p')
          [[ "$commit_date" == '2026-08-27' ]]

          {
            printf 'FUZZ_CARGO=%s\n' "$fuzz_cargo"
            printf 'FUZZ_RUSTC=%s\n' "$fuzz_rustc"
            printf 'FUZZ_RUSTDOC=%s\n' "$fuzz_rustdoc"
          } >> "$GITHUB_ENV"

      - name: Run the approved fuzz targets with fixed bounds
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/eutheto-fuzz/tmp
          FUZZ_ARTIFACTS: ${{ runner.temp }}/eutheto-fuzz/artifacts
          FUZZ_CORPUS: ${{ runner.temp }}/eutheto-fuzz/corpus
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$FUZZ_ARTIFACTS"
          nix develop --no-update-lock-file .#full --command env \
            FUZZ_CARGO="$FUZZ_CARGO" \
            FUZZ_RUSTC="$FUZZ_RUSTC" \
            FUZZ_RUSTDOC="$FUZZ_RUSTDOC" \
            FUZZ_ARTIFACTS="$FUZZ_ARTIFACTS" \
            FUZZ_CORPUS="$FUZZ_CORPUS" \
            just fuzz-check

      - name: Record fuzz evidence status
        shell: bash
        env:
          TARGET_COUNT: ${{ steps.discover.outputs.target_count }}
          CORPUS_COUNT: ${{ steps.discover.outputs.corpus_count }}
        run: |
          set -euo pipefail
          {
            echo '## Fuzz evidence'
            echo
            echo "Completed bounded fuzz runs for all ${TARGET_COUNT} required target(s) with ${CORPUS_COUNT} checked-in seed corpus file(s)."
            echo
            echo "Fuzz compiler: ${FUZZ_TOOLCHAIN}; fixed libFuzzer seed: 0; one worker per target."
            echo 'Only this completed execution is evidence. Crash artifacts are deliberately not uploaded until a reviewed sanitization contract exists.'
          } >> "$GITHUB_STEP_SUMMARY"
