packages:
  - "apps/*"
  - "packages/*"

overrides:
  # Patched tooling transitive versions; remove when parent ranges include them.
  "glob@13.0.6": "14.0.2"
  "minimatch@10.2.6": "11.0.1"
  "minimatch@11.0.0": "11.0.1"
  "minimatch@3.1.5>brace-expansion": "1.1.21"

allowBuilds:
  edgedriver: false
  esbuild: false
  geckodriver: false
  vue-demi: false

supportedArchitectures:
  os:
    - linux
    - darwin
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

# Vue Testing Library's public declarations use these undeclared dependencies.
packageExtensions:
  "@testing-library/vue@8.1.0":
    dependencies:
      pretty-format: "27.5.1"
      type-fest: "4.41.0"
      vue-component-type-helpers: "3.3.11"

patchedDependencies:
  '@testing-library/vue@8.1.0': patches/@testing-library__vue@8.1.0.patch
  vue-router@5.3.0: patches/vue-router@5.3.0.patch
