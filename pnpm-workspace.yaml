packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  edgedriver: false
  esbuild: false
  geckodriver: false
  vue-demi: false

supportedArchitectures:
  os:
    - linux
    - darwin
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

# Vue Testing Library's public declarations use these undeclared dependencies.
packageExtensions:
  "@vue/eslint-config-typescript@14.9.0":
    dependencies:
      tinyglobby: "0.2.17"
  "@testing-library/vue@8.1.0":
    dependencies:
      pretty-format: "27.5.1"
      type-fest: "4.41.0"
      vue-component-type-helpers: "3.3.11"

patchedDependencies:
  '@testing-library/vue@8.1.0': patches/@testing-library__vue@8.1.0.patch
  '@vue/eslint-config-typescript@14.9.0': patches/@vue__eslint-config-typescript@14.9.0.patch
  vue-router@5.3.0: patches/vue-router@5.3.0.patch

# Remove the replaced glob parser and pin reviewed transitive corrections.
overrides:
  "@vue/eslint-config-typescript@14.9.0>fast-glob": "-"
  "brace-expansion@5.0.9": "5.0.12"
  "source-map-js@1.2.1": "1.2.2"
  "postcss-selector-parser@7.1.5": "7.1.6"
