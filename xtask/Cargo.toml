[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "=1.0.104"
blake3 = "=1.8.7"
base64 = "=0.23.1"
eutheto-protocol = { path = "../crates/eutheto-protocol" }
eutheto-types = { path = "../crates/eutheto-types" }
eutheto-domain-api = { path = "../crates/eutheto-domain-api" }
eutheto-export = { path = "../crates/eutheto-export" }
clap = { version = "=4.6.6", features = ["derive"] }
prost = "=0.14.4"
prost-build = "=0.14.4"
prost-types = "=0.14.4"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rustix = { version = "=1.1.4", features = ["fs"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"

[build-dependencies]
prost-build = "=0.14.4"
