[package]
name = "eutheto-workforce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "=1.8.7"
csv-core = "=0.1.13"
eutheto-domain-api = { path = "../../../crates/eutheto-domain-api" }
eutheto-domain-ir = { path = "../../../crates/eutheto-domain-ir" }
eutheto-planning-ir = { path = "../../../crates/eutheto-planning-ir" }
eutheto-types = { path = "../../../crates/eutheto-types" }
jiff = { version = "=0.2.38", features = ["serde", "tzdb-bundle-always"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = "=1.28.0"

[dev-dependencies]
ical = { version = "=0.11.0", default-features = false, features = ["ical"] }
